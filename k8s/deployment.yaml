apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservicio-devops
  labels:
    app: microservicio-devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservicio-devops
  template:
    metadata:
      labels:
        app: microservicio-devops
    spec:
      containers:
        - name: microservicio
          image: linssiel/microservicio-devops:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: microservicio-devops-svc
spec:
  selector:
    app: microservicio-devops
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP