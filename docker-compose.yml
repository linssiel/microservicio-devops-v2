# Orquestación local / entorno simulado (staging).
#
# Local (construye la imagen):   docker compose up --build
# Pipeline (usa imagen de GHCR): IMAGE=ghcr.io/<owner>/<repo>:<sha> docker compose up -d --no-build
services:
  node-app:
    image: ${IMAGE:-node-app:local}
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped
    # Healthcheck: compose marca el contenedor healthy/unhealthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Escalabilidad / desempeño: límites de recursos
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    # Seguridad: endurecimiento del contenedor
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
