name: Pipeline CI/CD DevOps

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  pruebas-y-calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias y ejecutar pruebas
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Análisis de Calidad y Seguridad (SonarCloud Quality Gate)
        uses: SonarSource/sonarcloud-github-action@c685a203e52a19fa71923440d451234d92d91709 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

  construir-escanear-y-publicar:
    needs: pruebas-y-calidad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Construir imagen Docker
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker build -t "$DOCKER_USER/microservicio-devops:latest" .

      - name: Escaneo de vulnerabilidades con Trivy (Bloqueo ante fallas CRITICAL)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # 0.28.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/microservicio-devops:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Login y Push a Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
          docker push "$DOCKER_USER/microservicio-devops:latest"
